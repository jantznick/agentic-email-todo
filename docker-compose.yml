services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  email-ingest:
    build: ./ingest
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy

  task-worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
